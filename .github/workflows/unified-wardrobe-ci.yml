name: Build The Axiom unified wardrobe (Paper 1.21.11)
on:
  push:
    branches: ['feature/axiom-wardrobe-unified-1.0']
    paths: ['unified/**','.github/workflows/unified-wardrobe-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: unified
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: unified/pom.xml
      - name: Compile against real Paper API (no stubs)
        run: mvn -B --no-transfer-progress clean verify
      - name: Validate built jar
        run: |
          jar tf target/AxiomWardrobeUnified-1.0.0-rc1.jar | grep -q 'online/theaxiom/wardrobe/unified/AxiomWardrobeUnifiedPlugin.class'
          jar tf target/AxiomWardrobeUnified-1.0.0-rc1.jar | grep -q '^plugin.yml$'
          ! jar tf target/AxiomWardrobeUnified-1.0.0-rc1.jar | grep -q '^org/bukkit/'
          sha256sum target/AxiomWardrobeUnified-1.0.0-rc1.jar
      - uses: actions/upload-artifact@v4
        with:
          name: AxiomWardrobeUnified-1.0.0-rc1-JAR
          path: unified/target/AxiomWardrobeUnified-1.0.0-rc1.jar
          retention-days: 14
