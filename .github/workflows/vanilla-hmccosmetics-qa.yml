name: Security gate — no functional vanilla cosmetic pilot
on:
  push:
    branches: [integration/hmccosmetics-pilot]
    paths:
      - 'integration/hmccosmetics/vanilla-pilot/**'
      - '.github/workflows/vanilla-hmccosmetics-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired-pilot-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject withdrawn, equippable test assets
        run: |
          test -f integration/hmccosmetics/vanilla-pilot/README-RU.md
          test ! -e integration/hmccosmetics/vanilla-pilot/cosmetics/axiom_vanilla_pilot.yml
          test ! -e integration/hmccosmetics/vanilla-pilot/menus/axiom_vanilla_pilot.yml
          grep -q 'SECURITY BLOCKER' integration/hmccosmetics/vanilla-pilot/README-RU.md
          echo "PASS: unsafe vanilla armor/elytra pilot is retired"
